version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: botica_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: botica_novasalud
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - botica-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: botica_backend
    restart: always
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: botica_novasalud
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - botica-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: botica_frontend
    restart: always
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - WDS_SOCKET_PORT=0
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - botica-network

volumes:
  mysql_data:

networks:
  botica-network:
    driver: bridge

